<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Lao Lottery · Admin Portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Lao National Lottery Management System — Administration Portal" />
    <meta name="theme-color" content="#0b3d91" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet" />
  </head>
  <body class="mat-typography">
    <ll-root>
      <!-- Pre-bootstrap splash: replaced as soon as Angular takes over -->
      <div class="app-boot-splash">
        <div class="app-boot-splash__mark">LL</div>
        <div class="app-boot-splash__bar"><span></span></div>
        <p class="app-boot-splash__text" id="ll-boot-text">Loading Lao Lottery Admin Portal…</p>
      </div>
    </ll-root>
    <!-- The splash shows before Angular (and its translations) load, so it reads the saved language itself. -->
    <script>
      try {
        if (JSON.parse(localStorage.getItem('ll-admin:ui.language')) === 'lo') {
          document.documentElement.lang = 'lo';
          document.getElementById('ll-boot-text').textContent = 'ກຳລັງໂຫລດລະບົບຜູ້ບໍລິຫານຫວຍລາວ…';
        }
      } catch (error) {
        /* storage unavailable: keep the English splash */
      }
    </script>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem">
        This application requires JavaScript. Please enable it to continue.<br />
        ແອັບພລິເຄຊັນນີ້ຕ້ອງໃຊ້ JavaScript. ກະລຸນາເປີດໃຊ້ງານເພື່ອດຳເນີນການຕໍ່.
      </p>
    </noscript>
  </body>
</html>
